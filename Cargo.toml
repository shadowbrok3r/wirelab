[workspace]
resolver = "2"
members = [
    "crates/wirelab-proto",
    "crates/wirelab-core",
    "crates/wirelab-link",
    "crates/wirelab-flow-ui",
    "crates/wirelab-gui",
]
exclude = ["firmware/wirelab-fw", "lsp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
wirelab-proto = { path = "crates/wirelab-proto", features = ["std"] }
wirelab-core = { path = "crates/wirelab-core" }
wirelab-link = { path = "crates/wirelab-link" }
wirelab-flow-ui = { path = "crates/wirelab-flow-ui" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
postcard = { version = "1.1.3", default-features = false }
heapless = { version = "0.9.3", features = ["serde"] }
cobs = { version = "0.5.1", default-features = false }
crc = "3.4.0"
bitflags = { version = "2.13.2", features = ["serde"] }
rhai = "1.27.0"
# Vendored rhai-lsp workspace (lsp/): parser + semantic model for live lints.
rhai-rowan = { path = "lsp/crates/rhai-rowan" }
rhai-hir = { path = "lsp/crates/rhai-hir" }
url = "2.5.8"
thiserror = "2.0.21"
anyhow = "1.0.104"
log = "0.4.34"
env_logger = "0.11.11"
crossbeam-channel = "0.5.17"
serialport = { version = "4.10.1", default-features = false }
egui = { version = "0.37.0", features = ["serde", "monochrome_emoji_fonts"] }
eframe = { version = "0.37.0", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui_extras = { version = "0.37.0", features = ["serde"] }
egui-phosphor = "0.14.0"
egui-theme-kit = { git = "https://github.com/shadowbrok3r/egui-theme-kit", rev = "09d1e793076357ec5d86df7e1d6771d0306f2e70", default-features = false, features = ["title-bar", "picker", "files"] }
egui-snarl = { version = "0.12.0", features = ["serde"] }
rfd = "0.17.2"
ureq = { version = "3.5.0", features = ["json"] }
rmcp = { version = "3.7.0", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.8.9"
schemars = "1.2.3"
directories = "6.0.0"

[patch.crates-io]
# egui 0.37-compatible phosphor icons (upstream lags behind egui releases).
egui-phosphor = { git = "https://github.com/shadowbrok3r/egui-phosphor", branch = "egui-037" }
# Vendored egui 0.37 copies of the flow editor's snarl stack.
egui-snarl = { path = "patches/egui-snarl" }
egui-scale = { path = "patches/egui-scale" }

[profile.release]
lto = "thin"
strip = true
