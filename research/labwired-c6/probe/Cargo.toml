[package]
name = "c6-probe"
version = "0.1.0"
edition = "2024"

[dependencies]
esp-hal = { version = "1.1.1", features = ["unstable", "esp32c6"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6"] }
esp-backtrace = { version = "0.19.0", features = ["panic-handler", "println", "esp32c6"] }
esp-println = { version = "0.17.0", default-features = false, features = ["esp32c6", "uart", "critical-section"] }
nb = "1.1.0"

[profile.release]
opt-level = "s"
debug = true

[workspace]
